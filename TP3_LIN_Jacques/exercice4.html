<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculatrice JavaScript</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="exercice4.css" />
    <script src="exercice4.js" defer></script>
  </head>
  <body class="p-3">
    <div
      class="calculatrice card p-4 shadow-sm"
      style="max-width: 420px; width: 100%"
    >
      <div class="d-flex justify-content-end mb-2">
        <button id="btnTheme" class="btn btn-sm btn-outline-secondary">
          Mode sombre
        </button>
      </div>

      <h2 class="text-center mb-4">Calculatrice JavaScript</h2>

      <div class="mb-3">
        <input
          type="number"
          id="nombre1"
          class="form-control"
          placeholder="Nombre 1"
          step="any"
        />
      </div>

      <div class="mb-3">
        <select id="operation" class="form-select text-center fw-bold">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </div>

      <div class="mb-3">
        <input
          type="number"
          id="nombre2"
          class="form-control"
          placeholder="Nombre 2"
          step="any"
        />
      </div>

      <button id="calculer" class="btn btn-dark w-100 mt-2">Calculer</button>

      <p id="resultat" class="mt-3 text-center fs-5 fw-bold mb-0"></p>
    </div>
  </body>
</html>
